name: Build and Push Node-RED Oracle Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
  schedule:
    - cron: '0 0 * * 0'   # 每週日 08:00（台北）

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/nodered-oracle
  BASE_TAG: 5-debian
  ORACLE_RU: "19.27"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ci-test:latest
          build-args: BASE_TAG=${{ env.BASE_TAG }}

      - name: Verify image
        id: ver
        run: |
          docker run --rm --entrypoint sh ci-test:latest -c '
            head -2 /etc/os-release
            node -v
            ldd /opt/oracle/instantclient/libclntsh.so | grep -i "not found" && exit 1 || echo "libclntsh ldd OK"
            ldd /opt/oracle/instantclient/sqlplus | grep -i "not found" && exit 1 || echo "sqlplus ldd OK"
          '
          NR=$(docker run --rm --entrypoint node ci-test:latest \
            -p "require(\"/usr/src/node-red/node_modules/node-red/package.json\").version")
          if [ -z "$NR" ]; then echo "無法取得 Node-RED 版本"; exit 1; fi
          echo "Node-RED $NR"
          echo "nr=$NR" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.nr }}-oracle${{ env.ORACLE_RU }}
            type=raw,value=latest

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BASE_TAG=${{ env.BASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
