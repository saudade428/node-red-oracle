name: Build and Push Node-RED Oracle Image

on:
  # 當修改並推送到 main 分支時觸發
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
  # 排程觸發：每週日半夜自動重包一次
  # 這樣即使你沒改程式，也能固定抓取官方最新的 node-red:latest-debian 底層更新
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 這裡的標籤請替換成你的習慣，例如 nodered-oracle
          tags: ${{ secrets.DOCKER_USERNAME }}/nodered-oracle:latest
